<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Gestor de usuarios externos de EDatos</title>
        <base href="/" th:href="@{/}" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" th:href="${faviconUrl}" />
        <link rel="manifest" href="manifest.webmanifest" />
    </head>
    <body>
        <script th:inline="javascript">
            /*<![CDATA[*/
            window.CONFIGURATION = {};

            window.CONFIGURATION.endpoint = {};
            window.CONFIGURATION.endpoint.appUrl = /*[[${@metadataProperties.internalAppUrl}]]*/ 'http://localhost:4200';
            window.CONFIGURATION.endpoint.srmExternalEndpoint = /*[[${@metadataProperties.srmExternalEndpoint}]]*/ 'https://estadisticas.arte-consultores.com/structural-resources';

            window.CONFIGURATION.cas = {};
            window.CONFIGURATION.cas.login = /*[[${@metadataProperties.metamacCasLoginUrl}]]*/ 'https://estadisticas.arte-consultores.com/authentication-service-internal/login';
            window.CONFIGURATION.cas.logout = /*[[${@metadataProperties.metamacCasLogoutUrl}]]*/ 'https://estadisticas.arte-consultores.com/authentication-service-internal/logout';
            window.CONFIGURATION.cas.service = /*[[${@metadataProperties.casService}]]*/ 'http://localhost:4200/login/cas';

            window.CONFIGURATION.metadata = {};
            window.CONFIGURATION.metadata.navbarScriptUrl = /*[[${@metadataProperties.metamacNavbar}]]*/ '//estadisticas.arte-consultores.com/navigation-bar-internal/';
            window.CONFIGURATION.metadata.language =/*[[${language}]]*/ 'es';
            window.CONFIGURATION.metadata.defaultLanguage = /*[[${@metadataProperties.defaultLanguage}]]*/ 'es';
            window.CONFIGURATION.metadata.nationalities = /*[[${@metadataProperties.nationalityUrnKey}]]*/ 'urn:sdmx:org.sdmx.infomodel.codelist.Codelist=ISTAC:CL_M49_724(01.005)';
            window.CONFIGURATION.metadata.gender = /*[[${@metadataProperties.genderUrnKey}]]*/ 'urn:sdmx:org.sdmx.infomodel.codelist.Codelist=ESTAT:CL_GENDER(2.0)';
            window.CONFIGURATION.metadata.nationalitiesRestriction = /*[[${@metadataProperties.getNationalityRestriction}]]*/ 'PAISES';
            window.CONFIGURATION.metadata.genderRestriction = /*[[${@metadataProperties.getGenderRestriction}]]*/ 'SEXO';
            /*]]>*/
        </script>
        <app-root></app-root>
    </body>
</html>
