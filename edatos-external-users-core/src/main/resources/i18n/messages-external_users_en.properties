notice.subject.continue_migration_signup.title=New Era at IBESTAT: Important update to your IBESTAT user account
notice.subject.continue_migration_signup.text=<p>Dear registered user of the IBESTAT portal,</p>\
<p>I am contacting you on behalf of the IBESTAT team to share some exciting news and important updates that require your attention.</p>\
<h4>Technological Evolution and Improved Functionality</h4>\
<p>At IBESTAT, we are committed to continuous innovation and the improvement of our services. For this reason, we have updated the services we offer to registered users. This update not only allows us to provide you with a smoother and more efficient experience, but also opens the door to the introduction of new features designed to enrich your interaction with our data and analytics.</p>\
<h4>Password Renewal and Privacy Policy</h4>\
<p>As part of this transition, you need to renew your password in the new environment. This is crucial because, for security and privacy reasons, we have not transferred old passwords. Additionally, we ask that you take this opportunity to confirm that you accept our updated Privacy Policy, which reflects our commitment to transparency and the protection of your personal data. </p>\
<p>You have 60 days to complete this transition to the new service. If the process is not completed within this timeframe, your user account and all associated data will be deleted. However, you can always re-register for the service free of charge at any time.</p>\
<h4>How to proceed?</h4>\
<ul>\
    <li>Visit your <a href="{0}">custom eUsuarios profile link</a>.</li>\
    <li>Set your new password.</li>\
    <li>Review and accept our updated Privacy Policy.</li>\
</ul>\
<h4>What information will be migrated to the new service?</h4>\
<p>If you complete the steps above, you will remain a registered user of the IBESTAT portal, and we will proceed to migrate:</p>\
<ol type="a">\
    <li>Your thematic subscriptions to date. We recommend that, once your new account is activated, you review and update your subscriptions as needed, since internal restructuring of statistical operations may have resulted in some changes compared to your current setup.</li>\
    <li>Your custom queries that have been accessed at least once since 2020. We also recommend that, once your new account is activated, you review your custom queries, as IBESTAT\u2019s restructuring of its dissemination systems involves the following changes:</li>\
    <ul>\
        <li>\
            <p>The links to custom queries have changed in all cases. This is especially important if you use these links for redistribution on your own websites. The new links follow this format (for example, for a hypothetical query with code 6721):</p>\
            <p><a href="https://intranet.caib.es/ibestat-jaxi/generarUrlSocial.do?cod=6721">https://intranet.caib.es/ibestat-jaxi/generarUrlSocial.do?cod=6721</a></p>\
            <p>while the previous ones were:</p>\
            <p><a href="https://www.caib.es/ibestat/service/ibestat/generarUrlSocial?cod=6721">https://www.caib.es/ibestat/service/ibestat/generarUrlSocial?cod=6721</a></p>\
            <p>You can find your new valid links in your user profile, in the "Custom Queries" section.</p>\
        </li>\
        <li>\
            Some queries could not be migrated to the new system due to changes or removal of Pc-Axis tables. In such cases, we recommend recreating the queries you need using the new tables available on the new portal <a href="ibestat.es">ibestat.es</a>.\
        </li>\
        <li>\
            Finally, we are in the process of migrating our data tables to a new infrastructure. This <a href="https://ibestat.es/dades-obertes/organitzacio-i-proces-de-migracio-de-la-informacio-que-produeix-el-ibestat/">migration process</a> will take several years and means that each time an operation is migrated to the new system, custom queries will need to be recreated. You can check which operations have been migrated at any time on this <a href="https://ibestat.es/dades-obertes/llistat-doperacions-estadistiques-migrades-a-la-infraestructura-edades/">page</a>. If you are subscribed to a statistical operation that is migrated, you will also be notified by email.\
        </li>\
    </ul>\
</ol>\
<h4>Commitment to Security and Privacy</h4>\
<p>We want to assure you that at IBESTAT, the security and privacy of your information is our top priority. These improvements are a testament to our ongoing commitment to protecting your data and enhancing your overall experience with us.</p>\
<p>We appreciate your understanding and cooperation during this transition.  If you have any questions or need assistance, please do not hesitate to contact us at peticions@ibestat.caib.es .</p>\
<p>Thank you for your trust in IBESTAT and for being part of this exciting new stage in our technological evolution.</p>\
<p>Kind regards,</p>\
<p>The IBESTAT Team</p>
