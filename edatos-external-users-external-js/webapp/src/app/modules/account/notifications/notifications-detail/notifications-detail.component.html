<div class='page content'>
    <div class='page-header'>
        <div class='page-header-top'>
            <div class='general-buttons row'>
                <div class='row-large'>
                    <button class='text-icon-button btn-thin-default' routerLink='..'>
                        <span class='fa-thin fa-left'></span>
                        <span>{{ 'filter.form.goBack' | translate | uppercase }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class='page-body'>
        <div class='detail-info'>
            <label class='title'>{{ 'notices.label.subject' | translate }}</label>
            <span>{{ notice.subject }}</span>

            <label class='sendingDate'>{{ 'notices.label.receivedDate' | translate }}</label>
            <span>{{ notice.sendingDate | date: 'dd/MM/yyyy HH:mm:ss' }}</span>

            <label class='title'>{{ 'notices.label.message' | translate }}</label>
            <span class="info-description" [innerHTML]='joinMessagesText(notice.messages)'></span>

        </div>
    </div>
</div>
