<div class='page content'>
    <div class='page-header'>
        <div class="page-header-top">
            <div class='custom-control custom-switch'>
                <input type='checkbox' class='custom-control-input' ngModel
                       id='emailNotificationsEnabled'
                       [(ngModel)]='account.emailNotificationsEnabled'
                       (change)='toggleVisibility()'
                       name='emailNotificationsEnabled'>
                <label class='custom-control-label' for='emailNotificationsEnabled'
                       [ngClass]="markedEmailNotificationsEnabled?'label-inputswitch-checked':''">{{ 'account.form.emailNotificationsEnabled' | translate }}</label>
            </div>
        </div>
    </div>
    <div class='page-body'>
        <div class='col-md-12 justify-content-md-center text-center'>
            <div *ngIf='!noticesLoaded' class='spinner-border text-info' role='status'></div>
        </div>
        <ng-container *ngIf='noticesLoaded'>
            <ng-container *ngIf='notices.length > 0;else emptyList'>
                <div class='page-table-container-fluid'>
                    <arte-table
                        [columns]='columns'
                        [value]='notices'
                        [rows]='itemsPerPage'
                        [totalRecords]='totalItems'
                        [rowsPerPageOptions]='paginatorOptions'
                        tableStyleClass='page-table table-has-pointer-rows'
                        (onLazyLoad)='loadData($event)'
                    >
                        <ng-template pTemplate='body' let-notice>
                            <tr [routerLink]="['../notifications', notice.urn]">
                                <td>{{notice.sendingDate | date: 'dd/MM/yyyy HH:mm:ss'}}</td>
                                <td>{{notice.subject}}</td>
                            </tr>
                        </ng-template>
                    </arte-table>
                </div>
            </ng-container>
            <ng-template #emptyList>
                <div class='no-content'>
                    <img src='assets/images/no-results.png' [alt]="'arte.entity-list-empty.detail' | translate" />
                    <div class='no-content-text'>
                        <div class='title' translate='notices.list.noNotice'></div>
                    </div>
                </div>
            </ng-template>
        </ng-container>
    </div>
</div>
