<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <title>Usuarios externos</title>
        <base href="/" th:href="@{/}" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" th:href="${faviconUrl}" />
        <link rel="manifest" href="manifest.webmanifest" />
    </head>
    <body>

        <script th:inline="javascript">
            /*<![CDATA[*/
            window.CONFIGURATION = {};

            window.CONFIGURATION.endpoint = {};
            window.CONFIGURATION.endpoint.appUrl = /*[[${@metadataProperties.externalAppUrl}]]*/ 'http://localhost:4200';

            window.CONFIGURATION.metadata = {};
            window.CONFIGURATION.metadata.defaultLanguage = /*[[${@metadataProperties.defaultLanguage}]]*/ 'es';
            window.CONFIGURATION.metadata.languageCookie = /*[[${@metadataProperties.languageCookie}]]*/ 'chosenLocale';

            window.CONFIGURATION.template = {};
            window.CONFIGURATION.template.headerUrl = /*[[${headerUrl}]]*/ "http://localhost:8070/complementos-apps/organisations/istac/common/header/header.html?appName=Mi%20%C3%A1rea%20personal";
            /*]]>*/
        </script>
        <script src="http://localhost:8080/api/captcha/authentication.js" th:src="${captchaAuthenticationUrl}"></script>

        <app-root></app-root>
        <div th:utext="${footerHtml}"></div>
    </body>
</html>
