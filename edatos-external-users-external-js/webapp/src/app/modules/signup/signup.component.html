<div class='page content'>
    <div class='page-header'>
        <div class='page-header-top'>
            <h1 class='page-header-title' translate='signup.home.title'></h1>
        </div>
        <p class='page-header-content'></p>
    </div>
    <div class='page-body'>
        <form class='page-form' id='edit-form' name='editForm' role='form' novalidate (ngSubmit)='save()'
              #editForm='ngForm' autocomplete='off' [passwordMatch]="['password', 'confirmPassword']">
            <fieldset class='page-section' arteAutofocus>

                <!-- Primer bloque -->
                <div *ngIf='!isMigratedUser' class='form-group form-group-block'>
                    <div class='row divider'>
                        <div class='col-md-12 form-section'>
                            <div class='row'>
                                <div class='form-group form-group-inline col-md-4 required'
                                     [formControlStatus]='editForm.controls.name'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.name'
                                               for='name'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input id='name' name='name' [(ngModel)]='user.name' [maxlength]='255'
                                                        [required]='true' [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4 required'
                                     [formControlStatus]='editForm.controls.surname1'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.surname1'
                                               for='surname1'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input id='surname1' name='surname1' [(ngModel)]='user.surname1'
                                                        [maxlength]='255'
                                                        [required]='true' [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='editForm.controls.surname2'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.surname2'
                                               for='surname2'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input id='surname2' name='surname2' [(ngModel)]='user.surname2'
                                                        [maxlength]='255' [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Segundo bloque -->
                    <div class='row divider'>
                        <div class='col-md-12 form-section'>
                            <div class='row'>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='editForm.controls.gender'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.gender'
                                               for='gender'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-autocomplete-short-list
                                                [required]='false'
                                                inputId='gender'
                                                id='gender'
                                                name='gender'
                                                [multiple]='false'
                                                [(ngModel)]='gender'
                                                [suggestions]='genders'
                                                [properties]="['name']">
                                            </arte-autocomplete-short-list>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.birthday'
                                               for='birthday'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <app-custom-calendar id='birthday' name='birthday'
                                                                 [(ngModel)]='user.birthday'
                                                                 class='calendar'
                                                                 [required]='false'></app-custom-calendar>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='editForm.controls.nationality'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.nationality'
                                               for='nationality'></label>
                                        <div class='col-md-12 form-input-container'>
                                            <arte-autocomplete-short-list
                                                [required]='false'
                                                inputId='nationality'
                                                id='nationality'
                                                name='nationality'
                                                [multiple]='false'
                                                [(ngModel)]='nationality'
                                                [suggestions]='countries'
                                                [properties]="['name']">
                                            </arte-autocomplete-short-list>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tercer bloque -->
                    <div class='row divider'>
                        <div class='col-md-12 form-section'>
                            <div class='row'>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='editForm.controls.organism'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.organism'
                                               for='organism'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input id='organism' name='organism' [(ngModel)]='user.organism'
                                                        [maxlength]='255' [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class='form-group form-group-block'>
                    <div class='row divider'>
                        <div class='col-md-12 form-section'>
                            <div *ngIf='!isMigratedUser' class='row'>
                                <div class='form-group form-group-inline col-md-4 required'
                                     [formControlStatus]='editForm.controls.email'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.email'
                                               for='email'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input [disabled]='isMigratedUser' id='email' name='email'
                                                        [(ngModel)]='user.email'
                                                        [required]='true' [placeholder]='"xxxx@xxxxxx.xx"'
                                                        [minlength]='3' [maxlength]='255' [email]='true'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <li *ngFor='let m of messages'>{{m}}</li>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='editForm.controls.phoneNumber'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.phoneNumber'
                                               for='phoneNumber'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input id='phoneNumber' name='phoneNumber'
                                                        [(ngModel)]='user.phoneNumber'
                                                        [maxlength]='50' [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4 required'
                                     [formControlStatus]='editForm.controls.language'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.language'
                                               for='language'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-autocomplete-enum
                                                id='language'
                                                name='language'
                                                [multiple]='false'
                                                [(ngModel)]='user.language'
                                                [suggestionsEnum]='languageEnum'
                                                [translationPath]="'language.'"
                                                [required]='true'
                                            >
                                            </arte-autocomplete-enum>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class='col-md-12 form-section'>
                            <div class='row'>
                                <div class='form-group form-group-inline col-md-4 required'
                                     [formControlStatus]='editForm.controls.password'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.password'
                                               for='password'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input type='password' id='password' name='password'
                                                        [(ngModel)]='user.password'
                                                        [required]='true' [minlength]='8'
                                                        [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <ul>
                                                    <li *ngFor='let m of messages'>{{m}}</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4 required'
                                     [formControlStatus]='editForm.controls.confirmPassword'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.confirmPassword'
                                               for='confirmPassword'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input type='password' id='confirmPassword' name='confirmPassword'
                                                        [(ngModel)]='confirmPassword' [required]='true'
                                                        [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <ul>
                                                    <li *ngFor='let m of messages'>{{m}}</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Checkbox y Captcha Container -->
                <div class='form-group'>
                    <div class='row divider'>
                        <div class='form-group col-md-9 external-form'>
                            <input type='checkbox' name='active' ngModel required />
                            <a class='btn btn-link' target='_blank' routerLink='/data-protection-policy'
                               routerLinkActive='active'
                               translate='signup.form.termsAndConditions'></a>
                        </div>
                        <div class='form-group col-md-3 external-form-information'>
                            <p>{{ 'global.messages.requiredFields' | translate }}</p>
                        </div>
                    </div>
                </div>
                <div class='form-group'>
                    <div class='row divider'>
                        <div class='form-group col-md-4 external-form'>
                            <div #captchaContainer class='form-row'></div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
        <div class='external-form general-buttons row'>
            <ng-container>
                <div class='row-large'>
                    <button type='submit' form='edit-form' [disabled]='editForm.form.invalid || isSaving'
                            class='text-icon-button btn-thin-first'>
                        <span class='fa-thin fa-floppy-disk'></span>
                        <span>{{ 'entity.action.save' | translate | uppercase }}</span>
                    </button>
                    <button type='submit' class='text-icon-button btn-thin-cancel' (click)='navigateToLogin()'>
                        <span class='fa-thin fa-ban'></span>
                        <span>{{ 'entity.action.cancel' | translate | uppercase }}</span>
                    </button>
                </div>
            </ng-container>
        </div>
    </div>
</div>
