<div class='page content'>
    <div class='page-header'>
        <div class='page-header-top'>
            <div class='general-buttons row justify-content-end ml-auto'>
                <ng-container>
                    <div class='row'>
                        <button class='text-icon-button' (click)='cancel()' [disabled]='isSaving || isLoading'>
                            <arte-spinner class='spinner-btn' *ngIf='isLoading' aria-hidden='true'></arte-spinner>
                            <span *ngIf='!isLoading' class='fa fa-times'></span>
                            <span translate='filter.form.cancel'></span>
                        </button>
                        <button class='text-icon-button' type='button'
                                (click)='submit()' [disabled]='isSaving || isLoading || !filterForm.form.valid'>
                            <arte-spinner class='spinner-btn' *ngIf='isSaving' aria-hidden='true'></arte-spinner>
                            <span *ngIf='!isSaving' class='fa fa-save'></span>
                            <span translate='filter.form.save'></span>
                        </button>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>

    <div class='page-body'>
        <form class='page-form' id='filter-form' name='filterForm' role='form' novalidate #filterForm='ngForm'
              autocomplete='off'>
            <fieldset class='page-section' [disabled]='isLoading' arteAutofocus>
                <!-- Primer bloque -->
                <div class='form-group'>
                    <div class='row divider'>
                        <div class='col-md-12 form-section'>
                            <div class='row'>
                                <div class='form-group form-group-inline col-md-12 required'
                                     [formControlStatus]='filterForm.controls.name'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10'
                                               for='name'>{{ "filter.entity.name" | translate }}</label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input id='name' name='name' [(ngModel)]='filter.name'
                                                        [maxlength]='255'
                                                        [required]='true'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class='form-group form-group-inline col-md-12'
                                     [formControlStatus]='filterForm.controls.notes'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10'
                                               for='notes'>{{ "filter.entity.notes" | translate }}</label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <textarea
                                                [rows]='5'
                                                [cols]='30'
                                                pInputTextarea
                                                autoResize='autoResize'
                                                id='notes'
                                                name='notes'
                                                [(ngModel)]='filter.notes'
                                                [maxlength]='4000'
                                            ></textarea>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <span *ngFor='let m of messages'>{{m}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>


        <div>
            <legend class='pt-3'>{{ "filter.form.audit" | translate }}</legend>
            <div class='row'>
                <div class='form-group col-md-6'>
                    <div class='form-row'>
                        <label class='form-label col-md-4'>{{ "filter.entity.createdDate" | translate }}</label>
                        <div class='col-md-8'>
                            <span>{{ filter.createdDate | date: 'dd/MM/yyyy HH:mm:ss' }}</span>
                        </div>
                    </div>
                </div>
                <div class='form-group col-md-6'>
                    <div class='form-row'>
                        <label class='form-label col-md-4'
                               for='name'>{{ "filter.entity.lastModifiedDate" | translate }}</label>
                        <div class='col-md-8'>
                            <span>{{ filter.lastModifiedDate | date: 'dd/MM/yyyy HH:mm:ss' }}</span>
                        </div>
                    </div>
                </div>
                <div class='form-group col-md-6'>
                    <div class='form-row'>
                        <label class='form-label col-md-4'
                               for='name'>{{ "filter.entity.lastAccessDate" | translate }}</label>
                        <div class='col-md-8 '>
                            <span>{{ filter.lastAccessDate | date: 'dd/MM/yyyy HH:mm:ss' }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
