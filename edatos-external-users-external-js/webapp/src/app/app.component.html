<jhi-navbar></jhi-navbar>
<div class='app'>
    <div class='container' *ngIf='isAuthenticated'>
        <div class='col col-12'>
            <app-my-folder-navbar *ngIf='isMyFolderSection'></app-my-folder-navbar>
            <app-my-account-navbar *ngIf='isMyAccountSection'></app-my-account-navbar>
        </div>
    </div>
    <div class='h-100 ui-fluid'>
        <p-toast [key]='errorAlertKey' styleClass='toast-errors' [autoZIndex]='false'>
            <ng-template let-message pTemplate='message'>
                <div class='ui-toast-summary' [innerHTML]='message.summary'></div>
                <div class='ui-toast-detail' [innerHTML]='message.detail'></div>
            </ng-template>
        </p-toast>
        <p-toast key='customAlertKey' styleClass='toast-success' [autoZIndex]='false'>
            <ng-template let-message pTemplate='message'>
                <div class='ui-toast-summary' [innerHTML]='message.summary'></div>
                <div class='ui-toast-detail' [innerHTML]='message.detail'></div>
            </ng-template>
        </p-toast>
        <div class='container'>
            <div class='col col-12'>
                <app-my-folder-sub-navbar *ngIf='isMyFolderSection'></app-my-folder-sub-navbar>
                <app-my-account-sub-navbar *ngIf='isMyAccountSection'></app-my-account-sub-navbar>

                <router-outlet></router-outlet>
            </div>
        </div>
        <router-outlet name='popup'></router-outlet>
    </div>
</div>
<jhi-footer></jhi-footer>
