<div class='page sub-navbar'>
    <div class='page-header-wrapper' *ngIf='isCorrectlyLogged'>
        <div class='page-header'>
            <div class='page-header-top'>
                <h1 class='page-header-title'>{{titleTranslate()}}</h1>
            </div>
            <div class='page-header-content'>{{contentTranslate()}}</div>
            <div *ngIf='accountSection' class='general-buttons row account-section-buttons'>
                <ng-container>
                    <button type='button' class='text-icon-button btn-thin-default' (click)='download($event)'>
                        <span
                            [ngClass]="downloadingPdf ? 'fa-thin fa-spinner fa-spin' : 'fa-thin  fa-download'"></span>
                        <span>{{ 'account.download.myInformation' | translate | uppercase }}</span>
                    </button>
                    <button type='button' class='text-icon-button btn-thin-cancel' (click)='openDeleteDialog()'>
                        <span class='fa-thin fa-trash-can'></span>
                        <span>{{ 'entity.action.unsubscribe' | translate | uppercase }}</span>
                    </button>
                </ng-container>
            </div>
        </div>
    </div>
</div>
<!-- SUB-SECTION-NAVBAR -->
<div class='page' *ngIf='isCorrectlyLogged'>
    <ng-container *ngIf='folderSection'>
        <div class='subsection-tab'>
            <ul class='nav nav-tabs'>
                <li class='nav-item' *ngFor='let link of folderNavLinks'>
                    <a class='nav-link' routerLink='{{link.link}}' (click)='activeFolderLink = link.label'
                       routerLinkActive='active'>{{link.label}}
                    </a>
                </li>
            </ul>
        </div>
    </ng-container>
    <ng-container *ngIf='accountSection'>
        <div class='subsection-tab'>
            <ul class='nav nav-tabs'>
                <li class='nav-item' *ngFor='let link of accountNavLinks'>
                    <a class='nav-link' routerLink='{{link.link}}' (click)='activeAccountLink = link.label'
                       routerLinkActive='active'>{{link.label}}
                    </a>
                </li>
            </ul>
        </div>
    </ng-container>
</div>
