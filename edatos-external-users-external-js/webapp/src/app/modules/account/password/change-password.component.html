<div class='page content'>
    <div class='page-header'>
        <div class='page-header-top'>
            <span class='page-header-title-text'></span>
            <div class='general-buttons row'>
                <ng-container>
                    <div class='row-large'>
                        <button type='submit' form='settings-form'
                                [disabled]='settingsForm.form.invalid || isSaving'
                                class='text-icon-button btn-thin-first'>
                            <span class='fa-thin fa-floppy-disk'></span>
                            <span>{{ 'entity.action.save' | translate | uppercase }}</span>
                        </button>
                        <button type='button' class='text-icon-button btn-thin-cancel' data-dismiss='modal'
                                (click)='clear()'>
                            <span class='fa-thin fa-ban'></span>
                            <span>{{ 'entity.action.cancel' | translate | uppercase }}</span>
                        </button>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
    <div class='page-body'>
        <form class='page-form' name='settingsForm' role='form' id='settings-form' (ngSubmit)='save()'
              #settingsForm='ngForm' novalidate autocomplete='off'
              [passwordMatch]="['newPassword', 'confirmNewPassword']"
              [passwordNotMatch]="['currentPassword', 'newPassword']">
            <fieldset class='page-section' arteAutofocus>
                <!-- Primer bloque -->
                <div class='form-group form-group-block'>
                    <div class='row divider'>
                        <div class='col-md-12 form-section'>
                            <div class='row'>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='settingsForm.controls.currentPassword'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10'
                                               translate='userManagement.password.old'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input type='password' id='currentPassword' name='currentPassword'
                                                        [(ngModel)]='currentPassword' [required]='true' [minlength]='8'>
                                            </arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <ul>
                                                    <li *ngFor='let m of messages'>{{m}}</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='settingsForm.controls.newPassword'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10'
                                               translate='userManagement.password.new'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input type='password' id='newPassword' name='newPassword'
                                                        [(ngModel)]='newPassword' [required]='true'
                                                        [minlength]='8'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <ul>
                                                    <li *ngFor='let m of messages'>{{m}}</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class='form-group form-group-inline col-md-4'
                                     [formControlStatus]='settingsForm.controls.confirmNewPassword'>
                                    <div class='form-row'>
                                        <label class='form-label col-md-10' translate='signup.form.confirmPassword'
                                               for='confirmNewPassword'></label>
                                        <div class='col-md-12 form-input-container errors-on-hover'>
                                            <arte-input type='password' id='confirmNewPassword'
                                                        name='confirmNewPassword'
                                                        [(ngModel)]='confirmNewPassword' [required]='true'
                                                        [placeholder]='""'></arte-input>
                                            <div class='form-errors-messages' *hasErrors='let messages'>
                                                <ul>
                                                    <li *ngFor='let m of messages'>{{m}}</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class='form-group'>
                    <div class='row divider'>
                        <div class='form-group col-md-4 external-form'>
                            <div #captchaContainer class='form-row'></div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</div>
