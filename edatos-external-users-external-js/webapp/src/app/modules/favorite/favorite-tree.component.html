<div class='page content'>
    <div class='page-header'>
        <div class='page-no-header-top'></div>
    </div>

    <div class='page-body'>
        <fieldset class='page-section' arteAutofocus>
            <div class='information-section'>
                <label class='label-title'>{{ "favorite.title" | translate }}</label>
            </div>
            <app-structural-resources-tree
                (onResourceSelect)='saveFavorite($event)'
                (onResourceUnselect)='deleteFavorite($event)'
                [favorites]='favorites'
            ></app-structural-resources-tree>
        </fieldset>
    </div>

</div>
