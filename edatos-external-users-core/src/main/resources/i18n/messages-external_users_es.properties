# Completar el registro tras la migración de usuarios del IBESTAT
notice.subject.continue_migration_signup.title=Nueva Era en IBESTAT: Actualizaci\u00f3n importante de su cuenta de usuario del IBESTAT
notice.subject.continue_migration_signup.text=<p>Estimado/a usuario registrado del portal del IBESTAT,</p>\
<p>Me dirijo a usted como parte del equipo del IBESTAT para compartir noticias emocionantes y algunas actualizaciones importantes que requieren de su atenci\u00f3n.</p>\
<h4>Evoluci\u00f3n Tecnol\u00f3gica y Mejora de la Funcionalidad</h4>\
<p>En el IBESTAT estamos comprometidos con la constante innovaci\u00f3n y mejora de nuestros servicios. Es por ello que hemos realizado una actualizaci\u00f3n de los servicios que ofrecemos a los usuarios registrados. Esta renovaci\u00f3n no solo nos permite ofrecerle una experiencia m\u00e1s fluida y eficiente, sino que tambi\u00e9n da pie a la introducci\u00f3n de nuevas funcionalidades dise\u00F1adas para enriquecer su interacci\u00f3n con nuestros datos y an\u00e1lisis.</p>\
<h4>Renovaci\u00f3n de Contrase\u00F1a y Pol\u00edtica de Privacidad</h4>\
<p>Como parte de esta transici\u00f3n, es necesario que renueve su contrase\u00F1a en el nuevo entorno. Esto es crucial, ya que, por razones de seguridad y privacidad, no hemos transferido las contrase\u00F1as antiguas. Adem\u00e1s, le solicitamos que aproveche esta oportunidad para confirmar la aceptaci\u00f3n de nuestra actualizada Pol\u00edtica de Privacidad, reflejando nuestro compromiso con la transparencia y la protecci\u00f3n de sus datos personales. </p>\
<p>Hemos establecido un plazo de 60 d\u00edas para realizar esta transici\u00f3n al nuevo servicio, en caso de que no realice el proceso procederemos a dar de baja su usuario y todos los datos que disponemos asociados a su cuenta. De todos modos, siempre podr\u00e1 volver a darse de alta de manera gratuita en el servicio en el momento que lo desee.</p>\
<h4>\u00bfC\u00f3mo proceder?</h4>\
<ul>\
    <li>Visite <a href="{0}">enlace personalizado a su perfil de eUsuarios</a>.</li>\
    <li>Establezca su nueva contrase\u00F1a.</li>\
    <li>Revise y acepte nuestra Pol\u00edtica de Privacidad actualizada.</li>\
</ul>\
<h4>\u00bfQu\u00e9 informaci\u00f3n se migrar\u00e1 al nuevo servicio?</h4>\
<p>En caso de que realice los pasos anteriores, continuar\u00e1 siendo un usuario registrado del portal del IBESTAT y procederemos a migrar:</p>\
<ol type="a">\
    <li>las suscripciones tem\u00e1ticas que ten\u00eda hasta la fecha. Le recomendamos que, una vez activada el alta en el nuevo sistema, consulte las suscripciones que tiene activas y las actualice a su gusto ya que por motivos de reestructuraci\u00f3n interna de las operaciones estad\u00edsticas podr\u00eda ocurrir que haya alg\u00fan cambio con respecto a lo que tiene actualmente.</li>\
    <li>las consultas personalizadas que tuviera creadas y que han sido consultadas en alguna ocasi\u00f3n desde 2020 incluido. Le recomendamos que, una vez activada el alta en el nuevo sistema, consulte las consultas personalizadas que tiene activas ya que la reestructuraci\u00f3n llevada a cabo por el IBESTAT de los sistemas de difusi\u00f3n lleva consigo los siguientes cambios:</li>\
    <ul>\
        <li>\
            <p>El enlace a las consultas personalizadas ha cambiado en todos los casos, esto es especialmente importante en el caso de que utilice los enlaces para su redifusi\u00f3n en sus p\u00e1ginas web. Los enlaces nuevos tienen esta url (por ejemplo para una hipot\u00e9tica consulta con c\u00f3digo 6721):</p>\
            <p><a href="https://intranet.caib.es/ibestat-jaxi/generarUrlSocial.do?cod=6721">https://intranet.caib.es/ibestat-jaxi/generarUrlSocial.do?cod=6721</a></p>\
            <p>mientras que las anteriores eran as\u00ed:</p>\
            <p><a href="https://www.caib.es/ibestat/service/ibestat/generarUrlSocial?cod=6721">https://www.caib.es/ibestat/service/ibestat/generarUrlSocial?cod=6721</a></p>\
            <p>Los nuevos enlaces v\u00e1lidos los puede consultar en su perfil de usuario en el apartado "Consultas personalizadas".</p>\
        </li>\
        <li>\
            Algunas consultas no han podido migrarse al nuevo sistema por cambios en las tablas de Pc-Axis o eliminaci\u00f3n de las mismas. En este caso, recomendamos que rehaga las consultas que necesita con las nuevas tablas disponibles en el nuevo portal <a href="ibestat.es">ibestat.es</a>.\
        </li>\
        <li>\
            Por \u00faltimo, estamos en un proceso de migraci\u00f3n de las tablas de datos a una nueva infraestructura. Este <a href="https://ibestat.es/dades-obertes/organitzacio-i-proces-de-migracio-de-la-informacio-que-produeix-el-ibestat/">proceso de migraci\u00f3n</a> durar\u00e1 unos a\u00f1os e implica que, cada vez que se migre una operaci\u00f3n al nuevo sistema, las consultas personalizadas se deber\u00e1n rehacer. Puede consultar las operaciones migradas en cada momento en este <a href="https://ibestat.es/dades-obertes/llistat-doperacions-estadistiques-migrades-a-la-infraestructura-edades/">enlace</a>, adem\u00e1s si est\u00e1 suscrito a la operaci\u00f3n estad\u00edstica a migrar ser\u00e1 informado de este hecho por correo electr\u00f3nico.\
        </li>\
    </ul>\
</ol>\
<h4>Compromiso con la Seguridad y la Privacidad</h4>\
<p>Quiero asegurarle que en IBESTAT, la seguridad y privacidad de su informaci\u00f3n es nuestra m\u00e1xima prioridad. Estas mejoras son un testimonio de nuestro compromiso continuo con la protecci\u00f3n de sus datos y la mejora de su experiencia general con nosotros.</p>\
<p>Agradecemos su comprensi\u00f3n y cooperaci\u00f3n en este proceso de transici\u00f3n. Si tiene alguna pregunta o necesita asistencia, no dude en contactarnos en peticions@ibestat.caib.es .</p>\
<p>Gracias por su confianza en IBESTAT y por ser parte de esta emocionante nueva etapa en nuestra evoluci\u00f3n tecnol\u00f3gica.</p>\
<p>Saludos cordiales,</p>\
<p>El Equipo de IBESTAT</p>
