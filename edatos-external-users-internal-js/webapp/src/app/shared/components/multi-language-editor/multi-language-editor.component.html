<div *ngFor="let locale of locales" class="single-language-editor">
    <div *ngIf="isEditMode || value.getLocalisedLabel(locale)">
        <h3 [class.required]="isRequiredLocale(locale)">{{'enum.localeToLanguage.' + locale.toUpperCase() | translate: {default: locale} }}</h3>
        <p-editor [id]="locale" (onTextChange)="onEditorChange($event, locale)" (onInit)="onEditorInit($event, locale)" (onSelectionChange)="onEditorTouched($event)"
                  [style]="{'height':'500px'}" [modules]="isEditMode ? null : { toolbar: false }" [class.no-toolbar]="!isEditMode" scrollingContainer=".scrolling-editor">
            <p-header>
                <span class="ql-formats">
                    <select class="ql-header"></select>
                </span>
                <span class="ql-formats">
                    <button class="ql-bold" aria-label="Bold"></button>
                    <button class="ql-italic" aria-label="Italic"></button>
                    <button class="ql-underline" aria-label="Underline"></button>
                </span>
                <span class="ql-formats">
                    <select title="Text Color" class="ql-color"></select>
                    <select title="Background Color" class="ql-background"></select>
                </span>
                <span class="ql-formats">
                    <button class="ql-list" value="ordered"></button>
                    <button class="ql-list" value="bullet"></button>
                </span>
                <span class="ql-formats">
                    <button aria-label="Link" class="ql-link"></button>
                </span>
                <span class="ql-formats">
                    <button aria-label="Remove Styles" class="ql-clean"></button>
                </span>
            </p-header>
        </p-editor>
    </div>
</div>
