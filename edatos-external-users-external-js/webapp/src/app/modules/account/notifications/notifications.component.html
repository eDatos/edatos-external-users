<div class='page content'>
    <div class='page-header'>
        <div class='page-no-header-top'></div>
    </div>
    <div class='page-body'>
        <div class='custom-control custom-switch'>
            <input type='checkbox' class='custom-control-input' ngModel
                   id='emailNotificationsEnabled'
                   [(ngModel)]='account.emailNotificationsEnabled'
                   (change)='toggleVisibility()'
                   name='emailNotificationsEnabled'>
            <label class='custom-control-label' for='emailNotificationsEnabled'
                   [ngClass]="markedEmailNotificationsEnabled?'label-inputswitch-checked':''">{{ 'account.form.emailNotificationsEnabled' | translate }}</label>
        </div>
        <div class='col-md-12 justify-content-md-center text-center'>
            <div *ngIf='!noticesLoaded' class='spinner-border text-info' role='status'></div>
        </div>
        <div class="table-custom-filter">
            <p-table
                scrollHeight="flex"
                [columns]='columns'
                [value]='virtualNotices'
                [rows]='this.itemsPerLoad'
                [scrollable]="true"
                [virtualScroll]="true"
                [virtualRowHeight]="rowHeight"
                [lazy]="true"
                columnResizeMode="expand"
                tableStyleClass='page-table table-has-pointer-rows table-layou-fixed'
                (onLazyLoad)='loadData($event)'
            >
                <ng-template pTemplate="colgroup" let-columns>
                    <colgroup>
                        <col *ngFor="let col of columns" [style.width]="col.width">
                    </colgroup>
                </ng-template>
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th *ngFor="let col of columns" [pSortableColumn]="col.fieldName" [pSortableColumnDisabled]="!col.sortable">
                            {{ printHeader(col) }}
                            <p-sortIcon *ngIf="col.sortable" [field]="col.fieldName"></p-sortIcon>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate='body' let-notice>
                    <tr [routerLink]="['../notifications', notice.urn]">
                        <td>{{ notice.sendingDate | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
                        <td>{{ notice.subject }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="loadingbody">
                    <tr [style.height]="rowHeight + 'px'">
                        <td *ngFor="let col of columns">
                        <span>
                            <ngx-skeleton-loader count="1" [theme]="{'margin-bottom': '0', height: '1rem'}"></ngx-skeleton-loader>
                        </span>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <div class='no-content'>
                        <img src='assets/images/no-results.png' [alt]="'arte.entity-list-empty.detail' | translate" />
                        <div class='no-content-text'>
                            <div class='title' translate='notices.list.noNotice'></div>
                        </div>
                    </div>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
