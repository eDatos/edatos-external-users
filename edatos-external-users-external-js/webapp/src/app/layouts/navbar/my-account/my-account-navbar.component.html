<div class='page'>
    <div class='page-header-wrapper' *ngIf='isCorrectlyLogged'>
        <div class='page-header'>
            <div class='page-header-top'>
                <h1 class='page-header-title' translate='global.menu.account.myAccount'></h1>
            </div>
            <p class='page-header-content'></p>
            <div class='general-buttons row'>
                <ng-container>
                    <div class='row justify-content-start ml-auto'>
                        <button type='button' class='text-icon-button btn-thin-default' (click)='download($event)'>
                            <span
                                [ngClass]="downloadingPdf ? 'fa-thin fa-spinner fa-spin' : 'fa-thin  fa-download'"></span>
                            <span>{{ 'account.download.myInformation' | translate | uppercase }}</span>
                        </button>
                        <button type='button' class='text-icon-button btn-thin-cancel' (click)='openDeleteDialog()'>
                            <span class='fa-thin fa-trash-can'></span>
                            <span>{{ 'entity.action.unsubscribe' | translate | uppercase }}</span>
                        </button>
                    </div>
                </ng-container>
            </div>
        </div>
        <nav class='navbar navbar-expand-lg'>
            <div class='collapse navbar-collapse' id='navbarResponsive' [ngbCollapse]='isNavbarCollapsed'>
                <ul class='navbar-nav ml-auto'>
                    <li ngbDropdown class='nav-item dropdown pointer' routerLinkActive='active'
                        [routerLinkActiveOptions]='{exact: false}'>
                        <div class='general-buttons row'>
                            <button class='text-icon-button' (click)='toggleNavbar()'
                                    [ngClass]="!isNavbarCollapsed ? 'menu-text-icon-button ' : ''"
                                    ngbDropdownToggle id='user-menu'>
                            <span class='text-icon-button'>
                                <span><i class='fa-thin fa-user'></i>
                                    {{ 'global.menu.account.myAccount' | translate | uppercase }}</span>&nbsp;
                                <i [ngClass]="!isNavbarCollapsed ? 'fa-thin fa-chevron-up' : 'fa-thin fa-chevron-down'"></i>
                            </span>
                            </button>
                        </div>
                        <ul class='dropdown-menu dropdown-menu-right' ngbDropdownMenu>
                            <li>
                                <a class='dropdown-item' (click)="navigateTo('filter')"
                                   routerLinkActive='active'>
                                    <i class='fa' aria-hidden='true'></i>
                                    <span translate='global.menu.account.myFolder'></span>
                                </a>
                            </li>
                            <hr />
                            <li>
                                <a class='dropdown-item' (click)="navigateTo('data-protection-policy')"
                                   routerLinkActive='active'>
                                    <i class='fa fa-fw fa-file' aria-hidden='true'></i>
                                    <span translate='entity.action.data-protection-policy'></span>
                                </a>
                            </li>
                            <li>
                                <a class='dropdown-item dialog-btn-pointer' (click)='openAboutDialog()'
                                   routerLinkActive='active'>
                                    <i class='fa fa-fw fa-info-circle' aria-hidden='true'></i>
                                    <span translate='entity.action.about'></span>
                                </a>
                            </li>
                            <hr />
                            <li>
                                <a class='dropdown-item btn' (click)='logout()' id='logout'
                                   [title]="'global.menu.account.logout' | translate">
                                    <i class='fa fa-fw fa-sign-out' aria-hidden='true'></i>
                                    <span translate='global.menu.account.logout'></span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</div>
