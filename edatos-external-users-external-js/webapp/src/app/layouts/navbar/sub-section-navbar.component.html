<div class='page'>
    <ng-container *ngIf='isCorrectlyLogged && folderSection'>
        <div class='subsection-tab'>
            <ul class='nav nav-tabs'>
                <li class='nav-item' *ngFor='let link of folderNavLinks'>
                    <a class='nav-link' routerLink='{{link.link}}' (click)='activeFolderLink = link.label'
                       routerLinkActive='active'>{{link.label}}
                    </a>
                </li>
            </ul>
        </div>
    </ng-container>
    <ng-container *ngIf='isCorrectlyLogged && accountSection'>
        <div class='subsection-tab'>
            <ul class='nav nav-tabs'>
                <li class='nav-item' *ngFor='let link of accountNavLinks'>
                    <a class='nav-link' routerLink='{{link.link}}' (click)='activeAccountLink = link.label'
                       routerLinkActive='active'>{{link.label}}
                    </a>
                </li>
            </ul>
        </div>
    </ng-container>
</div>
