<div class="page">
    <div class="page-header">
        <div class="page-header-top">
            <button type="button" (click)="goBack()" class="btn btn-secondary btn-frameless back-arrow" [attr.aria-label]="'entity.action.back' | translate">
                <i class="material-icons">arrow_back</i>
            </button>
            <h2 class="page-header-title">
                <span class="page-header-title-text">
                    {{ ('filter.name' | translate) + ': ' + filter.name }}
                </span>
            </h2>
        </div>
    </div>
    <div class="page-body">
        <form class="page-form" id="filter-form" name="filterForm" role="form" novalidate autocomplete="off">
            <fieldset class="d-flex flex-column" [disabled]="true" arteAutofocus>
                <legend class="pt-3">{{ "filter.form.legend" | translate }}</legend>
                <div class="row">
                    <div class="form-group form-group-inline col-md-6">
                        <div class="form-row">
                            <label class="form-label col-md-4">{{ "filter.entity.name" | translate }}</label>
                            <div class="col-md-8 form-input-container">
                                <label class="form-label">{{filter.name}}</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group form-group-inline col-md-6">
                        <div class="form-row">
                            <label class="form-label col-md-4">{{ "filter.entity.permalink" | translate }}</label>
                            <div class="col-md-8 form-input-container">
                                <a href="{{filter.urlPermalink}}" target="_blank">{{filter.urlPermalink}}</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group form-group-inline col-md-6">
                        <div class="form-row">
                            <label class="form-label col-md-4">{{ "filter.entity.notes" | translate }}</label>
                            <div class="col-md-8 form-input-container">
                                <label class="form-label">{{filter.notes}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset class="d-flex flex-column">
                <legend class="pt-3 mb-3">{{ "entity.audits.title" | translate }}</legend>
                <div class="row">
                    <div class="form-group form-group-inline col-md-6">
                        <div class="form-row">
                            <label class="form-label col-md-4">{{ "filter.entity.owner" | translate }}</label>
                            <div class="col-md-8 form-input-container">
                                <label *ngIf="!simplifiedSignUp" class="form-label">{{filter.externalUser.name}} {{filter.externalUser.surname1}} {{filter.externalUser.surname2}}</label>
                                <label *ngIf="simplifiedSignUp" class="form-label">{{filter.externalUser.email}}</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group form-group-inline col-md-6">
                        <div class="form-row">
                            <label class="form-label col-md-4">{{ "entity.audits.createdDate" | translate }}</label>
                            <div class="col-md-8 form-input-container">
                                <label class="form-label">{{filter.createdDate | date: 'd/M/yyyy H:mm:ss' }}</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group form-group-inline col-md-6">
                        <div class="form-row">
                            <label class="form-label col-md-4">{{ "filter.entity.lastAccessDate" | translate }}</label>
                            <div class="col-md-8 form-input-container">
                                <label class="form-label">{{filter.lastAccessDate | date: 'd/M/yyyy H:mm:ss' }}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</div>
