<div class='page content'>
    <div class='page-body'>
        <form class='page-form' id='edit-form' name='editForm' role='form' novalidate (ngSubmit)='requestReset()'
              #editForm='ngForm' autocomplete='off'>
            <fieldset class='page-section' arteAutofocus>
                <div class='row justify-content-md-center login-container'>
                    <div class='col-md-4 card shadow p-3 bg-white'>
                        <h2 class='card-title text-center mt-1'
                            translate='login.resetPassword.init.title'></h2>
                        <div class='card-body' *ngIf='!successSending'>
                            <div class='form-group'>
                                <div class='form-row'>
                                    <label class='form-label col-md-10' translate='login.form.email'
                                           for='email'></label>
                                    <div class='col-md-12 form-input-container errors-on-hover'>
                                        <arte-input id='email' name='email' [(ngModel)]='email'
                                                    [placeholder]="'login.form.email.format'"></arte-input>
                                    </div>
                                </div>
                            </div>
                            <ng-container>
                                <div class='button-container-login'>
                                    <div class='row justify-content-md-center'>
                                        <div class='form-group panel-container-buttons w-100'>
                                            <button type='submit' [disabled]='editForm.form.invalid'
                                                    class='btn btn-focus w-100'>
                                                <span class='fa fa-paper-plane'></span>
                                                <span>{{ 'login.resetPassword.init.send' | translate | uppercase }}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>
                        </div>
                        <div class='card-body success-sending' *ngIf='successSending'>
                            <div class='row success-sending-message'>
                                <div class='form-group'>
                                    <div class='col-md-12 justify-content-md-center text-center'>
                                        <p translate='login.resetPassword.init.successSending'></p>
                                    </div>
                                </div>
                            </div>
                            <ng-container>
                                <div class='button-container-login'>
                                    <div class='row justify-content-md-center'>
                                        <div class='form-group panel-container-buttons w-100'>
                                            <button type='submit' (click)='navigateToLogin()'
                                                    class='btn btn-focus w-100'>
                                                <span>{{ 'entity.action.accept' | translate | uppercase }}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</div>
