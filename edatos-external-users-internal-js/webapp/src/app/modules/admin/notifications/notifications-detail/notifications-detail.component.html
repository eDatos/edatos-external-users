<div class='page content'>
    <div class='page-header'>
        <div class='page-header-top'>
            <button
                type="button"
                routerLink="../"
                class="btn btn-secondary btn-frameless back-arrow"
                [attr.aria-label]="'entity.action.back' | translate"
            >
                <i class="material-icons">arrow_back</i>
            </button>
            <h2 class="page-header-title">
                <span class="page-header-title-text">
                    {{ notification?.subject }}
                </span>
            </h2>
        </div>
    </div>
    <div class='page-body'>
        <div class='detail-info'>
            <div class="page-section">
                <h3>{{ 'notifications.label.receivers' | translate }}</h3>
                <ul class="receivers-list">
                    <li *ngFor="let receiver of displayedReceivers">{{receiver}}</li>
                </ul>
                <button *ngIf="thereAreTooManyReceivers" (click)="toggleDisplayedUsers()" class="btn btn-light see-more-button">
                    {{ (displayedReceivers.length === notification?.receivers.length ? 'global.button.see-less' : 'global.button.see-more') | translate }}
                </button>
            </div>
            <div class="page-section">
                <h3>{{ 'notifications.label.receivedDate' | translate }}</h3>
                <span>{{ notification?.sendingDate | date: 'dd/MM/yyyy HH:mm:ss':timeZone }}</span>
            </div>

            <div class="page-section">
                <h3>{{ 'notifications.label.message' | translate }}</h3>
                <div class="notification-content">
                    <span [innerHTML]='getNotificationMessage()'></span>
                </div>
            </div>
        </div>
    </div>
</div>
