<div class='page content'>
    <div class='page-body'>
        <form class='page-form' id='edit-form' name='editForm' role='form' id='editForm' (ngSubmit)='save()'
              #editForm='ngForm' novalidate autocomplete='off' [passwordMatch]="['newPassword', 'confirmPassword']">
            <fieldset class='page-section' arteAutofocus>
                <div class='row justify-content-md-center login-container reset-password'>
                    <div class='col-md-4 card shadow p-3 bg-white background-container'>
                        <h5 class='card-title text-center mt-1' translate='login.resetPassword.finish.title'></h5>
                        <div class='card-body'>
                            <div class='form-group' [formControlStatus]='editForm.controls.newPassword'>
                                <div class='form-row'>
                                    <label class='form-label col-md-10' translate='signup.form.password'
                                           for='newPassword'></label>
                                    <div class='col-md-12 form-input-container errors-on-hover'>
                                        <arte-input
                                            type='password'
                                            id='newPassword'
                                            name='newPassword'
                                            [(ngModel)]='keyAndPassword.newPassword'
                                            [required]='true'
                                            [minlength]='8'
                                            [placeholder]="'userManagement.password.new'"
                                        >
                                        </arte-input>
                                        <div class='form-errors-messages' *hasErrors='let messages'>
                                            <ul>
                                                <li *ngFor='let m of messages'>{{m}}</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class='form-group' [formControlStatus]='editForm.controls.confirmPassword'>
                                <div class='form-row'>
                                    <label class='form-label col-md-10' translate='signup.form.confirmPassword'
                                           for='confirmPassword'></label>
                                    <div class='col-md-12 form-input-container errors-on-hover'>
                                        <arte-input
                                            type='password'
                                            id='confirmPassword'
                                            name='confirmPassword'
                                            [(ngModel)]='confirmPassword'
                                            [required]='true'
                                            [placeholder]="'userManagement.password.confirmNew'"
                                        >
                                        </arte-input>
                                        <div class='form-errors-messages' *hasErrors='let messages'>
                                            <ul>
                                                <li *ngFor='let m of messages'>{{m}}</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <ng-container>
                                <div class='button-container-login'>
                                    <div class='row justify-content-md-center'>
                                        <div class='form-group panel-container-buttons w-100'>
                                            <button type='submit' [disabled]='editForm.form.invalid'
                                                    class='btn btn-first w-100'>
                                                <span translate='entity.action.save'></span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class='row justify-content-md-center'>
                                        <div class='form-group panel-container-buttons w-100'>
                                            <button type='button' class='btn btn-cancel w-100'
                                                    (click)='navigateToLogin()'>
                                                <span translate='entity.action.cancel'></span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</div>
