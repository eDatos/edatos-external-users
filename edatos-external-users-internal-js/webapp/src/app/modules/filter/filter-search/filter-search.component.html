<div class="page-filters">
    <div class="form-row">
        <div class="form-group col-md-6 col-lg-4">
            <label translate="filter.search.filterNameLabel"></label>
            <arte-input
                (keyup)="filter()"
                [(ngModel)]="filters.name"
                [attr.aria-label]="'filter.search.name' | translate"
                name="filterNameSearch"
                [placeholder]="'filter.search.placeholderForFilterNameSearch'"
            ></arte-input>
        </div>
        <div class="form-group col-md-6 col-lg-4">
            <label translate="filter.search.filterExternalUserLabel"></label>
            <arte-input
                (keyup)="filter()"
                [(ngModel)]="filters.user"
                [attr.aria-label]="'filter.search.name' | translate"
                name="filterUserSearch"
                [placeholder]="simplifiedSignUp ? 'filter.search.placeholderForUserEmailSearch' : 'filter.search.placeholderForUserSearch'"
            ></arte-input>
        </div>
        <div class="form-group col-md-6 col-lg-4">
            <label translate="filter.search.filterExternalOperationLabel"></label>
            <arte-autocomplete-short-list
                (onSelect)="onSelectOperations($event)"
                (onUnselect)="onUnselectOperations($event)"
                id='operation'
                dataKey='id'
                [multiple]='true'
                [suggestions]='externalOperations'
                [selectedSuggestions]="selectedOperations"
                [properties]="['code']"
            >
            </arte-autocomplete-short-list>
        </div>
        <div class="page-filters-btns col-md-6 col-lg-12">
            <button (click)="resetFilters()" class="btn btn-light">
                <em class="btn-icon fa fa-times"></em>
                <span translate="entity.action.filtersReset"></span>
            </button>
        </div>
    </div>
</div>
