<div class='page'>
    <nav class='navbar navbar-expand-lg' *ngIf='isCorrectlyLogged'>
        <button
            class='navbar-toggler'
            type='button'
            data-toggle='collapse'
            data-target='#navbarResponsive'
            aria-controls='navbarResponsive'
            aria-expanded='false'
            aria-label='Toggle navigation'
            (click)='toggleNavbar()'
        >
            <i class='fa fa-bars'></i>
        </button>

        <div class='collapse navbar-collapse' id='navbarResponsive' [ngbCollapse]='isNavbarCollapsed'>
            <ul class='navbar-nav ml-auto'>
                <li ngbDropdown class='nav-item dropdown pointer' routerLinkActive='active'
                    [routerLinkActiveOptions]='{exact: false}'>
                    <a class='nav-link dropdown-toggle btn' ngbDropdownToggle id='user-menu'>
                    <span>
                        <i class='fa fa-user-circle fa-2x' aria-hidden='true'></i>
                        <b class='caret'></b>
                    </span>
                    </a>
                    <ul class='dropdown-menu dropdown-menu-right' ngbDropdownMenu>
                        <li>
                            <a class='dropdown-item' routerLink='account-management' routerLinkActive='active'>
                                <i class='fa' aria-hidden='true'></i>
                                <span translate='global.menu.account.myAccount'></span>
                            </a>
                        </li>
                        <hr />
                        <li>
                            <a class='dropdown-item' routerLink='notifications' routerLinkActive='active'>
                                <i class='fa fa-envelope-o' aria-hidden='true'></i>
                                <span translate='global.menu.account.notifications'></span>
                            </a>
                        </li>
                        <hr />
                        <li>
                            <a class='dropdown-item' routerLink='/data-protection-policy' routerLinkActive='active'>
                                <i class='fa fa-fw fa-file' aria-hidden='true'></i>
                                <span translate='entity.action.data-protection-policy'></span>
                            </a>
                        </li>
                        <li>
                            <a class='dropdown-item dialog-btn-pointer' (click)='openAboutDialog()'
                               routerLinkActive='active'>
                                <i class='fa fa-fw fa-info-circle' aria-hidden='true'></i>
                                <span translate='entity.action.about'></span>
                            </a>
                        </li>
                        <hr />
                        <li>
                            <a class='dropdown-item btn' (click)='logout()' id='logout'
                               [title]="'global.menu.account.logout' | translate">
                                <i class='fa fa-fw fa-sign-out' aria-hidden='true'></i>
                                <span translate='global.menu.account.logout'></span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
</div>
