<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <title>Usuarios externos</title>
        <base href="/" th:href="@{/}" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" th:href="${faviconUrl}" />
        <link rel="manifest" href="manifest.webmanifest" />
    </head>
    <body>
        <script th:inline="javascript">
            /*<![CDATA[*/
            window.CONFIGURATION = {};

            window.CONFIGURATION.endpoint = {};
            window.CONFIGURATION.endpoint.appUrl = /*[[${@metadataProperties.externalAppUrl}]]*/ 'http://localhost:4200';
            window.CONFIGURATION.endpoint.srmExternalEndpoint = /*[[${@metadataProperties.srmExternalEndpoint}]]*/ 'https://estadisticas.arte-consultores.com/structural-resources/v1.0/';

            window.CONFIGURATION.metadata = {};
            window.CONFIGURATION.metadata.defaultLanguage = /*[[${@metadataProperties.defaultLanguage}]]*/ 'es';
            window.CONFIGURATION.metadata.languageCookie = /*[[${@metadataProperties.languageCookie}]]*/ 'chosenLocale';
            window.CONFIGURATION.metadata.nationalities = /*[[${@metadataProperties.nationalities}]]*/ 'urn:sdmx:org.sdmx.infomodel.codelist.Codelist=ISTAC:CL_M49_724(01.005)';
            window.CONFIGURATION.metadata.gender = /*[[${@metadataProperties.gender}]]*/ 'urn:sdmx:org.sdmx.infomodel.codelist.Codelist=ESTAT:CL_GENDER(2.0)';

            window.CONFIGURATION.template = {};
            window.CONFIGURATION.template.headerUrl =
                /*[[${headerUrl}]]*/ 'https://estadisticas.arte-consultores.com/apps/organisations/istac/common/header/header.html?appName=Mi%20%C3%A1rea%20personal';
            window.CONFIGURATION.template.footerUrl = /*[[${footerUrl}]]*/ 'https://estadisticas.arte-consultores.com/apps/organisations/istac/common/footer/footer.html';
            /*]]>*/
        </script>
        <script src="http://localhost:8080/api/captcha/authentication.js" th:src="${captchaAuthenticationUrl}"></script>

        <app-root></app-root>
    </body>
</html>
