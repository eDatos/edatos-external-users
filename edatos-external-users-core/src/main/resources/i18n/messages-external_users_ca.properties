# Completar el registro tras la migraci\u00f3n de usuarios del IBESTAT
notice.subject.continue_migration_signup.title=Nova Era a IBESTAT: Actualitzaci\u00f3 important del seu compte d''usuari de l''IBESTAT
notice.subject.continue_migration_signup.text=<p>Estimat/ada usuari registrat del portal de l''IBESTAT,</p>\
<p>Em dirigesc a vost\u00e8 com a part de l''equip de l''IBESTAT per a compartir not\u00edcies emocionants i algunes actualitzacions importants que requereixen de la seva atenci\u00f3.</p>\
<h4>Evoluci\u00f3 Tecnol\u00f2gica i Millora de la Funcionalitat</h4>\
<p>A l''IBESTAT estam compromesos amb la constant innovaci\u00f3 i millora dels nostres serveis. \u00e9s per aix\u00f2 que hem realitzat una actualitzaci\u00f3 dels serveis que oferim als usuaris registrats. Aquesta renovaci\u00f3 no sols ens permet oferir-li una experi\u00e8ncia m\u00e9s fluida i eficient, sin\u00f3 que tamb\u00e9 dona peu a la introducci\u00f3 de noves funcionalitats dissenyades per a enriquir la seva interacci\u00f3 amb les nostres dades i an\u00e0lisis.</p>\
<h4>Renovaci\u00f3 de Contrasenya i Pol\u00edtica de Privacitat</h4>\
<p>Com a part d''aquesta transici\u00f3, \u00e9s necessari que renovi la seva contrasenya en el nou entorn. Aix\u00f2 \u00e9s crucial, ja que, per raons de seguretat i privacitat, no hem transferit les contrasenyes antigues. A m\u00e9s, li sol\u00b7licitam que aprofiti aquesta oportunitat per a confirmar l''acceptaci\u00f3 de la nostra actualitzada Pol\u00edtica de Privacitat, reflectint el nostre comprom\u00eds amb la transpar\u00e8ncia i la protecci\u00f3 de les seves dades personals. </p>\
<p>Hem establert un termini de 60 dies per a realitzar aquesta transici\u00f3 al nou servei, en cas que no realitzi el proc\u00e9s procedirem a donar de baixa el seu usuari i totes les dades que disposam associats al seu compte. De totes maneres, sempre podr\u00e0 tornar a donar-se d''alta de manera gratu\u00efta en el servei en el moment que ho desitgi.</p>\
<h4>Com procedir?</h4>\
<ul>\
    <li>Visiti <a href="{0}">enlla\u00e7 personalitzat al seu perfil de eUsuarios</a>.</li>\
    <li>Estableixi la seva nova contrasenya.</li>\
    <li>Revisi i accepti la nostra Pol\u00edtica de Privacitat actualitzada.</li>\
</ul>\
<h4>Quina informaci\u00f3 es migrar\u00e0 al nou servei?</h4>\
<p>En cas que realitzi els passos anteriors, continuar\u00e0 sent un usuari registrat del portal de l''IBESTAT i procedirem a migrar:</p>\
<ol  type="a">\
    <li>les subscripcions tem\u00e0tiques que tenia fins avui. Li recomanem que, una vegada activada l''alta en el nou sistema, consulti les subscripcions que t\u00e9 actives i les actualitzi al seu gust ja que per motius de reestructuraci\u00f3 interna de les operacions estad\u00edstiques podria oc\u00f3rrer que hi hagi qualque canvi respecte al que t\u00e9 actualment.</li>\
    <li>les consultes personalitzades que tingu\u00e9s creades i que han estat consultades en alguna ocasi\u00f3 des de 2020 incl\u00f2s. Li recomanem que, una vegada activada l''alta en el nou sistema, consulti les consultes personalitzades que t\u00e9 actives ja que la reestructuraci\u00f3 duta a terme per l''IBESTAT dels sistemes de difusi\u00f3 implica els canvis seg\u00fcents:</li>\
    <ul>\
        <li>\
            <p>L''enlla\u00e7 a les consultes personalitzades ha canviat en tots els casos, aix\u00f2 \u00e9s especialment important en el cas que utilitzi els enlla\u00e7os per a la seva redifusi\u00f3 a les seves p\u00e0gines web. Els enlla\u00e7os nous tenen aquesta url (per exemple per a una hipot\u00e8tica consulta amb codi 6721):</p>\
            <p><a href="https://intranet.caib.es/ibestat-jaxi/generarUrlSocial.do?cod=6721">https://intranet.caib.es/ibestat-jaxi/generarUrlSocial.do?cod=6721</a></p>\
            <p>mentres que anteriorment eren aix\u00ed:</p>\
            <p><a href="https://www.caib.es/ibestat/service/ibestat/generarUrlSocial?cod=6721">https://www.caib.es/ibestat/service/ibestat/generarUrlSocial?cod=6721</a></p>\
            <p>Els nous enlla\u00e7os v\u00e0lids els pot consultar al el seu perfil d''usuari a l''apartat "Consultes personalitzades".</p>\
        </li>\
        <li>\
            Algunes consultes no han pogut migrar-se al nou sistema per canvis a les taules de Pc-Axis o eliminaci\u00f3 d''aquestes. En aquest cas, recomanem que refaci les consultes que necessita amb les noves taules disponibles al el nou portal <a href="www.ibestat.cat">www.ibestat.cat</a>.\
        </li>\
        <li>\
            Finalment, estem en un proc\u00e9s de migraci\u00f3 de les taules de dades a una nova infraestructura. Aquest <a href="https://ibestat.cat/dades-obertes/organitzacio-i-proces-de-migracio-de-la-informacio-que-produeix-el-ibestat/?lang=ca">proc\u00e9s de migraci\u00f3</a> durar\u00e0 uns anys i implica que, cada vegada que es migri una operaci\u00f3 al nou sistema, les consultes personalitzades s''hauran de refer. Pot consultar les operacions migrades a cada moment en aquest <a href="https://ibestat.cat/dades-obertes/llistat-doperacions-estadistiques-migrades-a-la-infraestructura-edades/?lang=ca">enlla\u00e7</a>, a m\u00e9s a m\u00e9s si est\u00e0 subscrit a l''operaci\u00f3 estad\u00edstica a migrar ser\u00e0 informat d''aquest fet per correu electr\u00f2nic.\
        </li>\
    </ul>\
</ol>\
<h4>Comprom\u00eds amb la Seguretat i la Privacitat</h4>\
<p>Vull assegurar-li que a IBESTAT, la seguretat i privacitat de la seva informaci\u00f3 \u00e9s la nostra m\u00e0xima prioritat. Aquestes millores s\u00f3n un testimoniatge del nostre comprom\u00eds continu amb la protecci\u00f3 de les seves dades i la millora de la seva experi\u00e8ncia general amb nosaltres.</p>\
<p>Agra\u00efm la seva comprensi\u00f3 i cooperaci\u00f3 en aquest proc\u00e9s de transici\u00f3. Si t\u00e9 alguna pregunta o necessita assist\u00e8ncia, no dubti a contactar-nos a peticions@ibestat.caib.es .</p>\
<p>Gr\u00e0cies per la seva confian\u00e7a en IBESTAT i per ser part d''aquesta emocionant nova etapa en la nostra evoluci\u00f3 tecnol\u00f2gica.</p>\
<p>Salutacions cordials,</p>\
<p>L''Equip d''IBESTAT</p>
